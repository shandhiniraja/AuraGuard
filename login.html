<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auraguard Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f7fbfc;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: #1f2937;
    }

    .logo span {
      background: #2ea3ad;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
    }

    .nav-text {
      color: #7a8a9a;
      font-size: 13px;
      max-width: 520px;
    }

    .home-btn {
      background: #2ea3ad;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }

    .login-card {
      background: #ffffff;
      width: 380px;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .login-card h2 {
      margin-bottom: 8px;
      color: #1f2937;
    }

    .login-card p {
      font-size: 14px;
      color: #7a8a9a;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 13px;
      color: #374151;
      display: block;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 20px;
      color: #6b7280;
    }

    .form-options a {
      color: #2ea3ad;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #2ea3ad;
      border: none;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #7a8a9a;
    }

    .footer-text a {
      color: #2ea3ad;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <span>🛡</span> Auraguard
  </div>

  <div class="nav-text">
    Secure login for caregivers, administrators, and clinical partners using Auraguard monitoring.
  </div>

  <a href="index.html">
    <button class="home-btn">Home</button>
  </a>
</header>

<div class="login-container">
  <div class="login-card">
    <h2>Login to Auraguard</h2>
    <p>Access real-time fall detection and heartbeat monitoring dashboards.</p>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <div class="form-options">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

    </form>

    <div class="footer-text">
      Don’t have an account? <a href="#">Contact Auraguard team</a>
    </div>

  </div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "admin@auraguard.com" && password === "admin123") {
      window.location.href = "dashboard.html";
    } else {
      alert("Invalid email or password");
    }
  });
</script>

</body>
</html>
